[project]
name = "aula-agent"
version = "0.1.0"
description = "Finder arrangementer i Aula-beskeder og -opslag og lægger dem i Google Calendar"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # Låst: aula_source bladrer med page = offset + 1, fordi 1.15.0 sender page-1 som index.
    # En version med upstream-rettelsen (#14) ville få den omvej til at springe opslag over,
    # så opgradering og fjernelse af omvejen skal ske i samme commit.
    "aula==1.15.0",
    "click>=8.0",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "pyjwt[crypto]>=2.9",
    "pypdf>=5",
    "python-multipart>=0.0.18",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.scripts]
aula-agent = "aula_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aula_agent"]
