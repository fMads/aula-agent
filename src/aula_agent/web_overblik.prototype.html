const EVENTS = {
 "post:1011#1":{title:"Frist: samtykke til foto", start:"2026-09-01", children:["A","B"]},
 "message:t1:m1#1":{title:"Forældremøde", start:"2026-09-17T19:00", children:["A"]},

const KIND = {post:"Opslag", message:"Besked"};

// ------------------------------------------------------------------ hjælpere
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const day = s => s.slice(0,10);
const MONTHS = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const DAYS = ["søn","man","tir","ons","tor","fre","lør"];
function fmt(s, withDay){ const d = new Date(day(s)+"T12:00"); const t = s.length>10 ? " "+s.slice(11,16) : "";
  return (withDay? DAYS[d.getDay()]+" ":"") + d.getDate()+". "+MONTHS[d.getMonth()] + t; }
function range(a,b){ return b && day(b)!==day(a) ? fmt(a,true)+" – "+fmt(b,true) : fmt(a,true); }
function isoWeek(s){ const d=new Date(day(s)+"T12:00"); const t=new Date(d); t.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const w1=new Date(t.getFullYear(),0,4); return [t.getFullYear(), 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)]; }
function mondayOf(s){ const d=new Date(day(s)+"T12:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.toISOString().slice(0,10); }
const evs = it => (it.events||[]).map(k => ({key:k, ...EVENTS[k]}));
// hvornår item'et gælder: periode, ellers første event, ellers hvornår det kom
function when(it){ if (it.period) return it.period.from; const e = evs(it).map(e=>day(e.start)).sort(); return e[0] || it.date; }
function until(it){ if (it.period) return it.period.to; const e = evs(it).map(e=>day(e.end||e.start)).sort(); return e[e.length-1] || null; }
// overstået: periode/arrangement/frist hvis alt er forbi; generel info aldrig (undtagen vigtig-markering)
function isOver(it){ if (it.art==="info") return false; const u = until(it); return u ? u < TODAY : false; }
function activeNow(it){ return (it.period && it.period.from <= TODAY && TODAY <= it.period.to) ||
  (it.important && !isOver(it) && (!it.period || it.period.to >= TODAY)); }
function artTag(it){ return `<span class="tag art-${it.art}">${ART[it.art]}</span>`; }
function meta(it){ return `${KIND[it.kind]} · ${esc(it.from)} · ${fmt(it.date)}${it.children.length>1?" · begge børn":""}`; }
const STATE = {variant: new URLSearchParams(location.search).get("variant") || "A", over:"dim", child:"alle",
  order:"gælder", q:"", arts:new Set(), topics:new Set(), kinds:new Set(), open:null};
const forChild = it => STATE.child==="alle" || it.children.includes(STATE.child);
function overCls(it){ if (!isOver(it)) return ""; return STATE.over==="hide" ? "hidden" : STATE.over==="dim" ? "over" : ""; }
function childChips(){ return `<div class="chips">${["alle","A","B"].map(c=>`<button class="chip ${STATE.child===c?"on":""}" data-child="${c}">${c==="alle"?"Begge børn":CHILDREN[c]}</button>`).join("")}</div>`; }
function row(it, extra=""){
  const ev = evs(it).filter(e=>day(e.end||e.start)>=TODAY).map(e=>`<span class="ev">${range(e.start,e.end)} ${esc(e.title)}</span>`).join("<br>");
  return `<li class="row ${overCls(it)}" data-key="${it.key}"><span class="grow">${artTag(it)}<span class="ttl">${it.sensitive?'<span class="lock">🔒 </span>':""}${esc(it.title)}</span>
    ${it.files.length?` <span class="mut">📎${it.files.length}</span>`:""}<span class="sum">${esc(it.summary)}</span><span class="mut">${meta(it)}</span>${ev?"<br>"+ev:""}${extra}</span></li>`; }

// ------------------------------------------------------------------ A: Tidslinje (uge for uge)
function VariantA(){
  const items = ITEMS.filter(forChild);
  const now = items.filter(activeNow);
  const key = it => STATE.order==="gælder" ? when(it) : it.date;
  const weeks = {};
  for (const it of items){ const m = mondayOf(key(it)); (weeks[m] ||= []).push(it); }
  const cur = mondayOf(TODAY);
  const future = Object.keys(weeks).filter(m=>m>=cur).sort(), past = Object.keys(weeks).filter(m=>m<cur).sort().reverse();
  const wk = m => { const [y,w]=isoWeek(m); const end=new Date(m+"T12:00"); end.setDate(end.getDate()+6);
    return `<section class="week ${m===cur?"cur":""}"><h3><span>Uge ${w}${m===cur?" · denne uge":""}</span><span class="mut">${fmt(m)} – ${fmt(end.toISOString().slice(0,10))}</span></h3>
    <ul class="list">${weeks[m].sort((a,b)=>key(a)<key(b)?-1:1).map(it=>row(it)).join("")}</ul></section>`; };
  return `${childChips()}
  <div class="chips"><span class="mut">Placér efter:</span>
   <button class="chip ${STATE.order==="gælder"?"on":""}" data-order="gælder">hvornår det gælder</button>
   <button class="chip ${STATE.order==="kom"?"on":""}" data-order="kom">hvornår det kom</button></div>
  <h2>Gælder nu</h2><div class="now"><ul class="list">${now.map(it=>row(it, it.period?`<br><span class="mut">gælder ${range(it.period.from,it.period.to)}</span>`:it.important?`<br><span class="mut">⭐ markeret vigtig i Aula</span>`:"")).join("") || '<li class="mut">Intet lige nu.</li>'}</ul></div>
  <h2>Kommende</h2>${future.map(wk).join("") || '<p class="mut">Intet.</p>'}
  <h2>Tidligere</h2>${past.map(wk).join("")}`;
}

// ------------------------------------------------------------------ B: Tavle efter art
function VariantB(){
  const items = ITEMS.filter(forChild);
  // "Kommer": events, ikke items – kalenderen set fra Aula-siden
  const upcoming = Object.entries(EVENTS).map(([k,e])=>({key:k,...e,src:ITEMS.filter(i=>(i.events||[]).includes(k)).pop()}))
    .filter(e=>STATE.child==="alle"||e.children.includes(STATE.child)).sort((a,b)=>a.start<b.start?-1:1);
  const evRow = e => { const over = day(e.end||e.start) < TODAY; const cls = over ? (STATE.over==="hide"?"hidden":STATE.over==="dim"?"over":"") : "";
    return `<li class="row ${cls}" data-key="${e.src.key}"><span class="date">${range(e.start,e.end)}</span><br><span class="ttl">${esc(e.title)}</span>
      ${e.updated?' <span class="tag">rettet</span>':""}${e.removed?` <span class="tag">fjernet for ${e.removed.map(c=>"Barn "+c).join(", ")}</span>`:""}
      <br><span class="mut">fra ${KIND[e.src.kind].toLowerCase()}: ${esc(e.src.title)}</span></li>`; };
  const periods = items.filter(it=>it.art==="periode" || activeNow(it)).sort((a,b)=>when(a)<when(b)?-1:1);
  const info = items.filter(it=>it.art==="info" && !it.sensitive || it.art==="info" && it.sensitive);
  const byTopic = {}; for (const it of info) (byTopic[it.topics[0]] ||= []).push(it);
  const docs = items.flatMap(it=>it.files.filter(f=>f.kind!=="image").map(f=>({f,it})));
  const images = items.flatMap(it=>it.files.filter(f=>f.kind==="image").map(f=>({f,it})));
  const small = it => `<li class="row ${overCls(it)}" data-key="${it.key}"><span class="ttl">${it.sensitive?'🔒 ':""}${esc(it.title)}</span>${it.important?" ⭐":""}<span class="sum">${esc(it.summary)}</span>
    <span class="mut">${it.period?range(it.period.from,it.period.to):fmt(it.date)} · ${KIND[it.kind]}</span></li>`;
  document.body.classList.add("wide");
  return `${childChips()}
  <div class="board">
   <div class="col"><h2>Gælder i perioder</h2><ul class="list">${periods.map(small).join("")}</ul></div>
   <div class="col"><h2>Arrangementer og frister</h2><p class="mut" style="margin:0">Det, der står i kalenderen, med kilden</p><ul class="list">${upcoming.map(evRow).join("")}</ul></div>
   <div class="col"><h2>Generel info</h2>${Object.entries(byTopic).sort().map(([t,its])=>`<h3>${esc(t)}</h3><ul class="list">${its.map(small).join("")}</ul>`).join("")}</div>
   <div class="col"><h2>Dokumenter</h2><ul class="list">${docs.map(({f,it})=>`<li class="row" data-key="${it.key}">${f.kind==="secure_document"?"🔒":"📄"} <span class="ttl">${esc(f.name)}</span>
      <br><span class="mut">${fmt(it.date)} · ${esc(it.title)}${f.kind==="secure_document"?" · kun i Aula":""}</span></li>`).join("")}</ul>
      <h3>Billeder</h3><p class="mut">${images.length} billeder på ${new Set(images.map(x=>x.it.key)).size} items</p></div>
  </div>`;
}

// ------------------------------------------------------------------ C: Søg med filtre
function VariantC(){
  const q = STATE.q.trim().toLowerCase();
  const hit = it => !q || [it.title,it.summary,it.body,it.from,...it.topics,...it.files.map(f=>f.name)].join(" ").toLowerCase().includes(q);
  const pass = it => forChild(it) && hit(it) && (!STATE.arts.size||STATE.arts.has(it.art)) && (!STATE.topics.size||it.topics.some(t=>STATE.topics.has(t)))
     && (!STATE.kinds.size || STATE.kinds.has(it.kind) || (STATE.kinds.has("doc") && it.files.some(f=>f.kind!=="image")));
  const res = ITEMS.filter(pass).sort((a,b)=>a.date<b.date?1:-1);
  const mark = s => q ? esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), m=>`<mark>${m}</mark>`) : esc(s);
  const count = f => ITEMS.filter(it=>forChild(it)&&hit(it)&&f(it)).length;
  const facet = (title, set, opts) => `<div class="facet"><h3>${title}</h3><div class="chips">${opts.map(([v,label,f])=>
     `<button class="chip ${set.has(v)?"on":""}" data-facet="${title}" data-v="${v}">${label} <span style="opacity:.6">${count(f)}</span></button>`).join("")}</div></div>`;
  const topics = [...new Set(ITEMS.flatMap(i=>i.topics))].sort();
  return `<input type="search" id="q" placeholder="Søg i alt fra Aula – fx svømning, lus, tilmelding …" value="${esc(STATE.q)}" autofocus>
  <div class="split" style="margin-top:1rem"><div>
    ${facet("Barn", new Set([STATE.child]), [["alle","Begge",()=>true],["A","Barn A",i=>i.children.includes("A")],["B","Barn B",i=>i.children.includes("B")]])}
    ${facet("Art", STATE.arts, Object.entries(ART).map(([k,l])=>[k,l,i=>i.art===k]))}
    ${facet("Kilde", STATE.kinds, [["post","Opslag",i=>i.kind==="post"],["message","Besked",i=>i.kind==="message"],["doc","Med dokument",i=>i.files.some(f=>f.kind!=="image")]])}
    ${facet("Emne", STATE.topics, topics.map(t=>[t,t,i=>i.topics.includes(t)]))}
  </div><div>
    <p class="mut">${res.length} af ${ITEMS.length}${q?` for »${esc(STATE.q)}«`:""} · nyeste først</p>
    <ul class="list">${res.map(it=>`<li class="row ${overCls(it)}" data-key="${it.key}"><span class="date">${fmt(it.date)}</span><span class="grow">${artTag(it)}<span class="ttl">${it.sensitive?"🔒 ":""}${mark(it.title)}</span>
       <span class="sum">${mark(it.sensitive?it.summary:it.body.slice(0,140))}</span>
       <span class="mut">${KIND[it.kind]} · ${esc(it.from)}${it.files.length?` · 📎 ${it.files.map(f=>mark(f.name)).join(", ")}`:""}${(it.events||[]).length?` · 📅 ${it.events.length}`:""}</span></span></li>`).join("")}</ul>
  </div></div>`;
}

// ------------------------------------------------------------------ detalje (fælles): hele teksten, filer, events, tråd
function Drawer(it){
  const thread = it.thread ? ITEMS.filter(i=>i.thread===it.thread) : [];
  const [shown, setShown] = [STATE.revealed===it.key];
  const ev = evs(it);
  return `<div class="drawer"><button class="x" data-close>✕</button>
   <div class="mut">${KIND[it.kind]} · ${esc(it.from)} · ${fmt(it.date,true)} 2026</div>
   <h2 style="margin-top:.3rem">${esc(it.title)}</h2>
   <div>${artTag(it)}${it.topics.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}${it.important?'<span class="tag">⭐ vigtig i Aula</span>':""}
     ${it.period?`<span class="mut"> gælder ${range(it.period.from,it.period.to)}</span>`:""}</div>
   <p><i>${esc(it.summary)}</i> <span class="mut">– agentens resumé</span></p>
   ${it.sensitive && !shown ? `<p class="lock">🔒 Følsom tråd. <button data-reveal="${it.key}">Vis teksten</button></p>` : `<div class="body">${esc(it.body)}</div>`}
   ${it.versions?`<p class="mut">Rettet i Aula · ${it.versions} versioner <a href="#">se den første</a></p>`:""}
   ${it.files.length?`<h3>Filer</h3><ul class="list">${it.files.map(f=>`<li>${f.kind==="image"?"🖼":f.kind==="secure_document"?"🔒":"📄"} <a href="#">${esc(f.name)}</a>${f.kind==="secure_document"?' <span class="mut">kan kun ses i Aula</span>':""}</li>`).join("")}</ul>`:""}
   <h3>Blev til i kalenderen</h3>${ev.length?`<ul class="list">${ev.map(e=>`<li><span class="date">${range(e.start,e.end)}</span><span class="grow">${esc(e.title)}<br>
     <span class="mut">${e.children.map(c=>CHILDREN[c]).join(", ")}${e.removed?` · fjernet af dig for ${e.removed.map(c=>CHILDREN[c]).join(", ")}`:""}${e.updated?" · rettet af en senere besked":""}</span></span></li>`).join("")}</ul>`:'<p class="mut">Ingen events.</p>'}
   ${thread.length>1?`<h3>Hele tråden (${thread.length})</h3><ul class="list">${thread.map(t=>`<li class="row" data-key="${t.key}"><span class="date">${fmt(t.date)}</span><span class="grow">${t.key===it.key?"<b>":""}${esc(t.from)}: ${esc(t.summary)}${t.key===it.key?"</b>":""}</span></li>`).join("")}</ul>`:""}
   <p class="mut" style="margin-top:1.5rem">${it.key}</p></div>`;
}

// ------------------------------------------------------------------ switcher + render
const VARIANTS = [["A","Tidslinje",VariantA],["B","Tavle efter art",VariantB],["C","Søg med filtre",VariantC]];
function render(){
  document.body.classList.remove("wide");
  const v = VARIANTS.find(x=>x[0]===STATE.variant) || VARIANTS[0];
  $("#app").innerHTML = v[2]();
  $("#vlabel").textContent = `${v[0]} (${v[1]})`;
  const it = ITEMS.find(i=>i.key===STATE.open);
  $("#drawer").innerHTML = it ? Drawer(it) : "";
  const q = $("#q"); if (q){ q.oninput = () => { STATE.q = q.value; render(); const n=$("#q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }; }
}
function go(d){ const i = VARIANTS.findIndex(x=>x[0]===STATE.variant); STATE.variant = VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length][0];
  const u = new URL(location); u.searchParams.set("variant", STATE.variant); try { history.replaceState(null,"",u); } catch {} STATE.open=null; render(); $("#shell").scrollTop=0; scrollTo(0,0); }
$("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1);
$("#over").onchange = e => { STATE.over = e.target.value; render(); };
document.addEventListener("keydown", e => { if (e.target.matches("input,textarea,[contenteditable]")) return;
  if (e.key==="ArrowLeft") go(-1); if (e.key==="ArrowRight") go(1); if (e.key==="Escape"){ STATE.open=null; render(); $("#shell").scrollTop=0; scrollTo(0,0); } });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-child],[data-order],[data-facet],[data-key],[data-close],[data-reveal]"); if (!t) return;
  if (t.dataset.child) STATE.child = t.dataset.child;
  else if (t.dataset.order) STATE.order = t.dataset.order;
  else if (t.dataset.facet){ const v=t.dataset.v; const set = {Art:STATE.arts, Emne:STATE.topics, Kilde:STATE.kinds}[t.dataset.facet];
    if (!set) STATE.child = v; else set.has(v) ? set.delete(v) : set.add(v); }
  else if (t.dataset.close !== undefined) STATE.open = null;
  else if (t.dataset.reveal) STATE.revealed = t.dataset.reveal;
  else if (t.dataset.key) STATE.open = t.dataset.key;
  render();
});
render();
</script></body></html>
